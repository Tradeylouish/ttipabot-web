<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTIPABot — Ritual</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="ritual-page">
  <audio id="chant" preload="auto">
    <source src="{{ url_for('static', filename='sardaukar-chant.mp3') }}" type="audio/mpeg">
  </audio>
  <audio id="growl" preload="auto">
    <source src="{{ url_for('static', filename='sardaukar-growl.mp3') }}" type="audio/mpeg">
  </audio>

  <div class="ritual-display" id="display-text"></div>

  <div class="ritual-controls" id="button-container">
    <button type="button" class="ritual-button" id="start-button">BEGIN RITUAL</button>
  </div>

  <script src="{{ url_for('static', filename='chanter.js') }}" defer></script>
</body>
</html>
