[project]
name = "ttipabot-web"
version = "1.0.0"
description = "Web frontend for TTIPABot"
requires-python = ">=3.14"
dependencies = [
  "flask>=3.1.1",
  "flask-sqlalchemy",
  "flask-migrate",
  "python-dotenv>=1.1.1",
  "requests>=2.32.5",
  "bs4>=0.0.2",
  "lxml>=6.0.0",
  "python-Levenshtein>=0.26.1",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = ["--import-mode=importlib"]

[project.optional-dependencies]
prod = ["gunicorn>=23.0.0"]

[dependency-groups]
dev = ["pytest>=8.4.1", "pytest-flask>=1.3.0"]
